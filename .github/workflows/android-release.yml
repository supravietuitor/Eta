name: Eta Release Gate

on:
  workflow_dispatch:
    inputs:
      release_gate_confirmed:
        description: Set true only after a separate Release Gate approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eta-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Validate version ledger and main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release_preflight.py
      - name: Stop at draft-release boundary
        if: ${{ inputs.release_gate_confirmed == false }}
        run: echo "Draft Release preview complete; signing and publishing remain blocked by the Release Gate."

  production-release:
    if: ${{ inputs.release_gate_confirmed == true }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6
        with:
          ref: main
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Restore production keystore
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eta-release.jks"
      - name: Verify certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ETA_RELEASE_CERT_SHA256 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
        run: |
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/eta-release.jks" \
            -storepass "$ETA_RELEASE_STORE_PASSWORD" \
            -alias "$ETA_RELEASE_KEY_ALIAS" \
            | awk -F': ' '/Certificate fingerprints/{seen=1} seen && /SHA256:/{print $2; exit}' \
            | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$EXPECTED_CERT_SHA256" && test "$actual" = "$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
      - name: Build signed production APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease
      - name: Draft-release handoff only
        run: echo "Signed artifact created after approval; formal tag and GitHub Release publication are intentionally not implemented in this gate."
